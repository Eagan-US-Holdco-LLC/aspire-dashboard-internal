name: Backmerge Release Branches

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at 00:00 UTC (16:00 PST / 17:00 PDT)
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  backmerge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.repository_owner == 'microsoft' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Add new release branch pairs here in order from oldest to newest.
          # Each entry merges `source` into `target` (e.g. release/13.3 → main).
          - source: release/13.3
            target: main

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.ASPIRE_BOT_APP_ID }}
          private-key: ${{ secrets.ASPIRE_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Full history needed for merge
          token: ${{ steps.app-token.outputs.token }}

      - name: Compute branch slug
        id: slug
        run: |
          # Convert branch names like "release/13.3" → "release-13.3" for use in
          # Git branch names and issue/PR titles, which cannot contain forward slashes.
          SOURCE_SLUG=$(echo "${{ matrix.source }}" | sed 's|/|-|g')
          TARGET_SLUG=$(echo "${{ matrix.target }}" | sed 's|/|-|g')
          echo "source_slug=$SOURCE_SLUG" >> $GITHUB_OUTPUT
          echo "target_slug=$TARGET_SLUG" >> $GITHUB_OUTPUT
          echo "branch_name=backmerge/${SOURCE_SLUG}-to-${TARGET_SLUG}" >> $GITHUB_OUTPUT

      - name: Check for changes to backmerge
        id: check
        run: |
          git fetch origin ${{ matrix.target }} ${{ matrix.source }}
          BEHIND_COUNT=$(git rev-list --count origin/${{ matrix.target }}..origin/${{ matrix.source }})
          echo "behind_count=$BEHIND_COUNT" >> $GITHUB_OUTPUT
          if [ "$BEHIND_COUNT" -gt 0 ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Found $BEHIND_COUNT commits in ${{ matrix.source }} not in ${{ matrix.target }}"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes to backmerge - ${{ matrix.source }} is up-to-date with ${{ matrix.target }}"
          fi

      - name: Attempt merge and create branch
        if: steps.check.outputs.changes == 'true'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout origin/${{ matrix.target }}
          git checkout -b ${{ steps.slug.outputs.branch_name }}

          # Attempt the merge
          if git merge origin/${{ matrix.source }} --no-edit; then
            echo "merge_success=true" >> $GITHUB_OUTPUT
            git push origin ${{ steps.slug.outputs.branch_name }} --force
            echo "Merge successful, branch pushed"
          else
            echo "merge_success=false" >> $GITHUB_OUTPUT
            git merge --abort
            echo "Merge conflicts detected"
          fi

      - name: Create or update Pull Request
        if: steps.check.outputs.changes == 'true' && steps.merge.outputs.merge_success == 'true'
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH_NAME="${{ steps.slug.outputs.branch_name }}"

          # Check if a PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base "${{ matrix.target }}" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists, updating it"
            echo "pull_request_number=$EXISTING_PR" >> $GITHUB_OUTPUT
          else
            PR_BODY=$(cat << 'PRBODY'
## Automated Backmerge

This PR merges changes from `${{ matrix.source }}` back into `${{ matrix.target }}`.

**Commits to merge:** ${{ steps.check.outputs.behind_count }}

This PR was created automatically to keep `${{ matrix.target }}` up-to-date with release branch changes.
Once approved, please merge using a **merge commit** (not squash or rebase).

---
*This PR was generated by the [backmerge-release](${{ github.server_url }}/${{ github.repository }}/actions/workflows/backmerge-release.yml) workflow.*
PRBODY
)

            PR_URL=$(gh pr create \
              --head "$BRANCH_NAME" \
              --base "${{ matrix.target }}" \
              --title "[Automated] Backmerge ${{ matrix.source }} to ${{ matrix.target }}" \
              --body "$PR_BODY" \
              --assignee joperezr,radical \
              --label area-engineering-systems)

            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::Failed to extract PR number from: $PR_URL"
              exit 1
            fi
            echo "pull_request_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "Created PR #$PR_NUMBER"
          fi

      - name: Create issue for merge conflicts
        if: steps.check.outputs.changes == 'true' && steps.merge.outputs.merge_success == 'false'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        env:
          SOURCE_BRANCH: ${{ matrix.source }}
          TARGET_BRANCH: ${{ matrix.target }}
          BEHIND_COUNT: ${{ steps.check.outputs.behind_count }}
        with:
          script: |
            const source = process.env.SOURCE_BRANCH;
            const target = process.env.TARGET_BRANCH;
            const behindCount = process.env.BEHIND_COUNT;
            const workflowRunUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Check if there's already an open issue for this specific branch pair
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backmerge-conflict',
              creator: 'github-actions[bot]'
            });

            // Match issues for this specific source→target pair by checking the title
            const matchingIssue = existingIssues.data.find(issue =>
              issue.title.includes(source) && issue.title.includes(target)
            );

            if (matchingIssue) {
              console.log(`Existing backmerge conflict issue found: #${matchingIssue.number}`);
              // Add a comment to the existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: matchingIssue.number,
                body: `⚠️ Merge conflicts still exist.\n\n**Workflow run:** ${workflowRunUrl}\n\nPlease resolve the conflicts manually.`
              });
              return;
            }

            // Create a new issue
            const issueBody = [
              '## Backmerge Conflict',
              '',
              `The automated backmerge from \`${source}\` to \`${target}\` failed due to merge conflicts.`,
              '',
              '### What to do',
              '',
              `1. Checkout \`${target}\` and attempt the merge locally:`,
              '   ```bash',
              `   git checkout ${target}`,
              `   git pull origin ${target}`,
              `   git merge origin/${source}`,
              '   ```',
              '2. Resolve the conflicts',
              '3. Push the merge commit or create a PR manually',
              '',
              '### Details',
              '',
              `**Workflow run:** ${workflowRunUrl}`,
              `**Commits to merge:** ${behindCount}`,
              '',
              '---',
              `*This issue was created automatically by the [backmerge-release](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/backmerge-release.yml) workflow.*`
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Backmerge] Merge conflicts between ${source} and ${target}`,
              body: issueBody,
              assignees: ['joperezr', 'radical'],
              labels: ['area-engineering-systems', 'backmerge-conflict']
            });
